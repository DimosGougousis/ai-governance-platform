# =============================================================================
# Agent Passport Schema (JSON Schema, YAML-serialized)
# Product Governance for Agentic AI Workflows
# =============================================================================
# Version: 1.0.0
# Last Updated: 2026-10-09
# Owner: AI Governance Office
# Cross-ref: ../../03-runtime-governance/agentic-workflows/agent-configuration-prerequisites.md
#            ../../03-runtime-governance/templates/agent-passport.yaml (annotated template)
# =============================================================================
#
# Purpose:
#   Machine-readable contract for an agent passport -- the single record that
#   holds an agent's identity, purpose, rules, oversight, tools and approval.
#   The registration gate validates every passport against this schema before
#   any credential is issued.
#
# When to Use:
#   - In the provisioning pipeline, as the first check of the registration gate
#   - When authoring a passport, to catch missing or malformed fields early
#
# Who Is Responsible:
#   - AI Governance Office -- Accountable: owns the schema and its versioning
#   - MLOps / Platform Engineering -- Responsible: runs validation in the pipeline
#   - Security Engineering -- Consulted: the identity and credential sections
#
# Regulatory Basis:
#   - EU AI Act Articles 12 and 72 -- record-keeping and post-market inventory
#   - DORA Article 8 -- identification of ICT assets and their dependencies
#   - DORA Article 9 -- access and credential policy
#
# What this schema cannot check, and the gate must:
#   - agent_id is unique across ALL passports, including revoked ones (never reused)
#   - every server_id in mcp_servers exists in the MCP server register and is approved
#   - every value is within its tier baseline (tier-baselines.yaml narrowing_rule)
#
# Validate a passport with:
#   python -c "import yaml, jsonschema; jsonschema.validate(
#       yaml.safe_load(open('examples/example-agent-passport.yaml')),
#       yaml.safe_load(open('agent-passport-schema.yaml')))"
# =============================================================================

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://governance.example/schemas/agent-passport-1.0.0.json"
title: "Agent Passport"
type: object
additionalProperties: false
required:
  - agent_id
  - agent_name
  - agent_type
  - version
  - purpose
  - owner
  - risk_tier
  - tier_baseline
  - model
  - oversight
  - identity
  - access
  - permission_boundary_ref
  - mcp_servers
  - enforcement
  - kill_switch_ref
  - registration

$defs:
  person:
    type: object
    additionalProperties: false
    required: [name, role]
    properties:
      name: { type: string, minLength: 1 }
      role: { type: string, minLength: 1 }
  date:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
  oversight_level:
    type: string
    enum: [hitl, hotl, hota]

properties:
  agent_id:
    type: string
    pattern: '^agent:[a-z0-9]+(-[a-z0-9]+)*-(dev|staging|prod)-[0-9]{2}$'
    description: "Immutable, never reused. agent:<name>-<env>-<instance>, e.g. agent:finley-prod-01"

  agent_name: { type: string, minLength: 1 }

  agent_type:
    type: string
    enum: [informational, advisory, decision_making, autonomous_actor, orchestrator]

  version:
    type: string
    pattern: '^\d+\.\d+\.\d+$'
    description: "Version of the agent application this passport describes"

  purpose:
    type: object
    additionalProperties: false
    required: [statement, business_outcome, intended_users, prohibited_uses]
    properties:
      statement: { type: string, minLength: 20, description: "What the agent exists to do" }
      business_outcome: { type: string, minLength: 1, description: "What a good outcome is, and how it is measured" }
      intended_users:
        type: array
        minItems: 1
        items: { type: string, minLength: 1 }
      prohibited_uses:
        type: array
        minItems: 1
        items: { type: string, minLength: 1 }
        description: "Uses the agent must not be put to, even if technically possible"

  owner:
    type: object
    additionalProperties: false
    required: [name, role, team]
    properties:
      name: { type: string, minLength: 1 }
      role: { type: string, minLength: 1 }
      team: { type: string, minLength: 1 }

  risk_tier:
    type: string
    enum: [minimal, limited, high]

  tier_baseline:
    type: string
    pattern: '^tier-baselines\.yaml#(high|limited|minimal)$'

  model:
    type: object
    additionalProperties: false
    required: [provider, model_id]
    properties:
      provider: { type: string, minLength: 1 }
      model_id: { type: string, minLength: 1 }
      model_version: { type: string }

  oversight:
    type: object
    additionalProperties: false
    required: [model, per_category, escalation_route]
    properties:
      model: { type: string, enum: [HITL, HOTL, HOTA] }
      per_category:
        type: object
        additionalProperties: false
        required: [read, write, decide, act, escalate]
        properties:
          read: { $ref: "#/$defs/oversight_level" }
          write: { $ref: "#/$defs/oversight_level" }
          decide: { $ref: "#/$defs/oversight_level" }
          act: { $ref: "#/$defs/oversight_level" }
          escalate: { $ref: "#/$defs/oversight_level" }
      hitl_points:
        type: array
        description: "Specific actions that always need a named human approver"
        items:
          type: object
          additionalProperties: false
          required: [action, approver_role]
          properties:
            action: { type: string, minLength: 1 }
            approver_role: { type: string, minLength: 1 }
      escalation_route: { type: string, minLength: 1 }

  identity:
    type: object
    additionalProperties: false   # no field may carry a secret
    required: [provider, principal_id, credential_ttl_minutes, credential_providers]
    properties:
      provider:
        type: string
        enum: [spiffe, aws_agentcore_identity, entra_agent_id, gcp_service_account, other_workload_identity]
      principal_id:
        type: string
        minLength: 1
        description: "The one workload principal bound to this agent_id in this environment"
      group_path:
        type: string
        description: "Directory or group the principal sits in; tier policies attach here"
      credential_ttl_minutes: { type: integer, minimum: 1 }
      credential_providers:
        type: array
        description: "Names of vault-held credentials the agent may request. Never the credential itself."
        items:
          type: object
          additionalProperties: false
          required: [name, kind, vault_ref]
          properties:
            name: { type: string, minLength: 1 }
            kind:
              type: string
              enum: [oauth2_client_credentials, oauth2_user_delegated, api_key, mtls_certificate]
            vault_ref: { type: string, minLength: 1 }

  access:
    type: object
    additionalProperties: false
    required: [mode]
    properties:
      mode: { type: string, enum: [autonomous, on_behalf_of_user] }
      consent:
        type: object
        additionalProperties: false
        required: [mechanism, record_ref, revocable]
        properties:
          mechanism: { type: string, minLength: 1 }
          record_ref: { type: string, minLength: 1 }
          revocable: { const: true }
      user_claims_in_policy:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [claim, must_match_input]
          properties:
            claim: { type: string, minLength: 1 }
            must_match_input: { type: string, minLength: 1 }
      effective_authority:
        const: intersection
        description: "Narrower of the user's rights and the agent's permission boundary"
    allOf:
      - if: { properties: { mode: { const: on_behalf_of_user } } }
        then: { required: [consent, user_claims_in_policy, effective_authority] }

  permission_boundary_ref:
    type: object
    additionalProperties: false
    required: [id, version]
    properties:
      id: { type: string, minLength: 1 }
      version: { type: string, pattern: '^\d+\.\d+\.\d+$' }

  mcp_servers:
    type: array
    description: "The agent's tool inventory: which servers it may reach and which operations on each. Empty if it uses none."
    items:
      type: object
      additionalProperties: false
      required: [server_id, allowed_operations]
      properties:
        server_id:
          type: string
          pattern: '^mcp:[a-z0-9]+(-[a-z0-9]+)*-(dev|staging|prod)$'
        allowed_operations:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }

  skills:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [skill_id, manifest_ref, enabled]
      properties:
        skill_id: { type: string, minLength: 1 }
        manifest_ref: { type: string, minLength: 1 }
        permission_boundary_ref: { type: string }
        enabled: { type: boolean }

  enforcement:
    type: object
    additionalProperties: false
    required: [mode, boundary_version, log_only_days]
    properties:
      mode: { type: string, enum: [log_only, enforce] }
      boundary_version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
      log_only_days: { type: integer, minimum: 1 }
      log_only_started: { $ref: "#/$defs/date" }
      enforce_from: { $ref: "#/$defs/date" }
      log_only_evidence_ref:
        type: string
        minLength: 1
        description: "Decision logs from the log-only period, retained as audit evidence"
    allOf:
      - if: { properties: { mode: { const: enforce } } }
        then: { required: [log_only_started, enforce_from, log_only_evidence_ref] }

  operations:
    type: object
    description: >
      Approved operational configuration. Live state -- health_state, the
      deployed version, last_deployment_date -- is held by the fleet monitoring
      platform keyed by agent_id, not in the passport, so that it can change
      without re-approval.
    additionalProperties: false
    required: [health_check_endpoint, health_check_interval_seconds]
    properties:
      health_check_endpoint: { type: string, minLength: 1 }
      health_check_interval_seconds: { type: integer, minimum: 1 }

  kill_switch_ref: { type: string, minLength: 1 }
  fallback_procedure_ref: { type: string }
  safety_policy_ref: { type: string }
  guardrail_spec_ref: { type: string }
  eval_suite_ref: { type: string }
  budget_config_ref: { type: string }
  circuit_breaker_ref: { type: string }

  compliance_frameworks:
    type: array
    items: { type: string, minLength: 1 }

  kpis:
    type: array
    items: { type: object }

  registration:
    type: object
    additionalProperties: false
    required: [status, created_date]
    properties:
      status: { type: string, enum: [draft, approved, suspended, revoked] }
      created_date: { $ref: "#/$defs/date" }
      approved_by: { $ref: "#/$defs/person" }
      approved_date: { $ref: "#/$defs/date" }
      review_due: { $ref: "#/$defs/date" }
      revoked_reason: { type: string }
    allOf:
      - if: { properties: { status: { enum: [approved, suspended] } } }
        then: { required: [approved_by, approved_date, review_due] }
      - if: { properties: { status: { const: revoked } } }
        then: { required: [revoked_reason] }

allOf:
  # The tier baseline must be the passport's own tier.
  - if: { properties: { risk_tier: { const: high } } }
    then:
      properties:
        tier_baseline: { const: "tier-baselines.yaml#high" }
        oversight:
          properties:
            per_category:
              properties:
                act: { enum: [hitl] }
                decide: { enum: [hitl, hotl] }
  - if: { properties: { risk_tier: { const: limited } } }
    then: { properties: { tier_baseline: { const: "tier-baselines.yaml#limited" } } }
  - if: { properties: { risk_tier: { const: minimal } } }
    then: { properties: { tier_baseline: { const: "tier-baselines.yaml#minimal" } } }
