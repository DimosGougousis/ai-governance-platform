# =============================================================================
# MCP Server Register Schema (JSON Schema, YAML-serialized)
# Product Governance for Agentic AI Workflows
# =============================================================================
# Version: 1.0.0
# Last Updated: 2026-10-09
# Owner: AI Governance Office
# Cross-ref: ../../03-runtime-governance/agentic-workflows/mcp-server-governance.md
#            ../../03-runtime-governance/templates/mcp-server-register-entry.yaml (annotated template)
# =============================================================================
#
# Purpose:
#   Machine-readable contract for an MCP server register entry. An agent may
#   reach only servers registered and approved against this schema, and only
#   the operations its passport lists for that server.
#
# When to Use:
#   - In the registration gate, before a server is reachable by any agent
#   - When a server's version, operations or tool descriptions change
#
# Who Is Responsible:
#   - Server Owner -- Accountable: the server's boundary and its register entry
#   - Security Engineering -- Responsible: third-party exceptions and authentication
#   - AI Governance Office -- Consulted: owns the schema
#
# Regulatory Basis:
#   - DORA Article 28 -- ICT third-party risk; third-party servers are third-party ICT services
#   - DORA Article 8 -- identification of ICT assets and dependencies
#   - EU AI Act Article 15 -- accuracy, robustness and cybersecurity
#
# What this schema cannot check, and the gate must:
#   - server_id is unique across the register and never reused
#   - the description_sha256 of each operation matches what the running server
#     advertises (a mismatch means the tool description changed: block and review)
#   - every boundary_action names an action on the calling agent's boundary
#     (an unlisted action is denied at call time by the gateway)
# =============================================================================

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://governance.example/schemas/mcp-server-1.0.0.json"
title: "MCP Server Register Entry"
type: object
additionalProperties: false
required:
  - server_id
  - name
  - purpose
  - owner
  - provenance
  - version
  - transport
  - authentication
  - data_classification
  - operations
  - server_side_controls
  - logging
  - registration

$defs:
  person:
    type: object
    additionalProperties: false
    required: [name, role]
    properties:
      name: { type: string, minLength: 1 }
      role: { type: string, minLength: 1 }
  date:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'

properties:
  server_id:
    type: string
    pattern: '^mcp:[a-z0-9]+(-[a-z0-9]+)*-(dev|staging|prod)$'
    description: "Immutable, never reused. mcp:<name>-<env>, e.g. mcp:customer-data-prod"

  name: { type: string, minLength: 1 }
  purpose: { type: string, minLength: 20 }

  owner:
    type: object
    additionalProperties: false
    required: [name, role, team]
    properties:
      name: { type: string, minLength: 1 }
      role: { type: string, minLength: 1 }
      team: { type: string, minLength: 1 }

  provenance:
    type: string
    enum: [in_house, third_party]

  exception:
    type: object
    description: "Required for a third-party server: the recorded exception to default-deny"
    additionalProperties: false
    required: [approved_by, approved_date, rationale, risk_assessment_ref, review_due]
    properties:
      approved_by: { $ref: "#/$defs/person" }
      approved_date: { $ref: "#/$defs/date" }
      rationale: { type: string, minLength: 20 }
      risk_assessment_ref: { type: string, minLength: 1 }
      review_due: { $ref: "#/$defs/date" }

  version:
    type: string
    pattern: '^(\d+\.\d+\.\d+|sha256:[a-f0-9]{64})$'
    description: "Pinned semantic version or image digest. Never 'latest'."

  transport:
    type: string
    enum: [stdio, streamable_http]

  endpoint: { type: string }

  authentication:
    type: object
    additionalProperties: false
    required: [method]
    properties:
      method: { type: string, enum: [workload_identity, mtls, oauth2] }
      audience: { type: string }

  data_classification:
    type: string
    enum: [public, internal, confidential, restricted]

  operations:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, access, description, description_sha256, requires_user_context]
      properties:
        name: { type: string, minLength: 1 }
        access:
          type: string
          enum: [read, write, act]
          description: "Matches the permission-boundary action categories"
        boundary_action:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: "The permission-boundary action this operation performs, checked against the agent's boundary for the operation's access category. Omitted: the operation name is used as the action."
        description: { type: string, minLength: 1 }
        description_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: "Hash of the tool description the server advertises; pinned so a silent change is caught"
        requires_user_context:
          type: boolean
          description: "True if the call must carry the delegating user's claims"

  server_side_controls:
    type: array
    minItems: 1
    description: "Controls the server enforces itself, independent of the agent's prompt"
    items: { type: string, minLength: 1 }

  logging:
    type: object
    additionalProperties: false
    required: [every_call_logged, destination, retention]
    properties:
      every_call_logged: { const: true }
      destination: { type: string, minLength: 1 }
      retention: { type: string, minLength: 1 }

  registration:
    type: object
    additionalProperties: false
    required: [status, created_date]
    properties:
      status: { type: string, enum: [draft, approved, suspended, revoked] }
      created_date: { $ref: "#/$defs/date" }
      approved_by: { $ref: "#/$defs/person" }
      approved_date: { $ref: "#/$defs/date" }
      review_due: { $ref: "#/$defs/date" }
      revoked_reason: { type: string }
    allOf:
      - if: { properties: { status: { enum: [approved, suspended] } } }
        then: { required: [approved_by, approved_date, review_due] }
      - if: { properties: { status: { const: revoked } } }
        then: { required: [revoked_reason] }

allOf:
  - if: { properties: { provenance: { const: third_party } } }
    then: { required: [exception] }
